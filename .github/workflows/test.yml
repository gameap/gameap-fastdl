name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - run: go test -race ./...
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v2.13
      - run: go build ./cmd/gameap-fastdl
